services:
  postgres:
    image: timescale/timescaledb:latest-pg12
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pollution
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_LOOPBACK_USERS: ""
    ports:
      - "5673:5672"
      - "15673:15672"

  backend:
    build:
      context: ./hava-kirliligi-projesi
      dockerfile: Dockerfile
    volumes:
      - ./hava-kirliligi-projesi:/app
    env_file:
      - ./hava-kirliligi-projesi/.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - rabbitmq

  frontend:
    build:
      context: ./hava-kirliligi-ui
      dockerfile: Dockerfile
    volumes:
      - ./hava-kirliligi-ui:/app
    ports:
      - "3000:80"
    depends_on:
      - backend

  producer:
    build:
      context: ./hava-kirliligi-projesi
      dockerfile: Dockerfile
    env_file:
      - ./hava-kirliligi-projesi/.env
    volumes:
      - ./hava-kirliligi-projesi:/app
    command: ["python", "app/rabbitmq_producer.py"]
    depends_on:
      - rabbitmq
    restart: unless-stopped

volumes:
  pgdata:
